services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinescope-web
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - .:/app
      - cinescope_node_modules:/app/node_modules
    # Instala solo si el volumen de node_modules está vacío; evita npm ci en cada restart.
    command: >
      sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi && npm run dev"

volumes:
  cinescope_node_modules:
